<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Security headers (stricter than main site because this page handles auth tokens) ──
       - CSP: no external scripts/styles allowed. Only inline script/style (needed for auth handling).
       - Referrer-Policy: no-referrer prevents token leakage to any external site.
       - Permissions-Policy: disable everything we don't need.
       - X-Frame-Options via CSP frame-ancestors: prevents clickjacking.
       - X-Content-Type-Options: prevents MIME-sniffing. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=(), clipboard-read=(), clipboard-write=()" />

  <!-- noindex: don't let search engines crawl this page; it contains auth tokens in URLs -->
  <meta name="robots" content="noindex, nofollow" />

  <title>LiftIQ — You're in!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }

    .logo-ring {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 0 40px rgba(249,115,22,0.35);
      font-size: 38px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 40px rgba(249,115,22,0.35); }
      50%       { box-shadow: 0 0 60px rgba(249,115,22,0.55); }
    }

    .app-name {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #f97316, #fb923c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 16px;
      color: #b0b0b0;
      line-height: 1.5;
      max-width: 280px;
      margin: 0 auto 40px;
    }

    .tagline strong {
      color: #f5f5f5;
      font-weight: 600;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 24px;
    }

    .status {
      font-size: 13px;
      color: #b0b0b0;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: blink 1.2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .heading {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .sub {
      font-size: 14px;
      color: #909090;
      line-height: 1.5;
    }

    .btn-open {
      display: block;
      width: 100%;
      max-width: 360px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: white;
      font-size: 16px;
      font-weight: 700;
      padding: 16px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 14px;
      transition: opacity 0.15s;
    }

    .btn-open:hover { opacity: 0.88; }

    .btn-store {
      display: block;
      width: 100%;
      max-width: 360px;
      background: transparent;
      color: #b0b0b0;
      font-size: 14px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #2a2a2a;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-store:hover { border-color: #f97316; color: #f97316; }

    .footer {
      margin-top: 48px;
      font-size: 12px;
      color: #606060;
    }

    .recovery-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(249,115,22,0.12);
      border: 1px solid rgba(249,115,22,0.25);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      color: #f97316;
      font-weight: 600;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="logo-ring" aria-hidden="true">🏋️</div>
  <div class="app-name">LiftIQ</div>
  <p class="tagline" id="tagline">
    You're ready to <strong>transform your life</strong>.<br/>
    Let's get to work.
  </p>

  <div class="card">
    <div class="status">
      <div class="status-dot" aria-hidden="true"></div>
      <span id="status-text">Opening LiftIQ…</span>
    </div>
    <div class="heading" id="card-heading">✅ You're confirmed!</div>
    <p class="sub" id="card-sub">
      Your account is verified. Tap below if the app doesn't open automatically.
    </p>
  </div>

  <a class="btn-open" id="btn-open" href="liftiq://">Open LiftIQ</a>
  <a class="btn-store" id="btn-store" href="https://apps.apple.com/app/id6759868402" target="_blank" rel="noopener noreferrer">
    Download on the App Store
  </a>

  <div class="footer">© 2026 LiftIQ. All rights reserved.</div>

  <script>
    // ═══════════════════════════════════════════════════════════════════════════
    //  LiftIQ auth callback handler — security-hardened
    //
    //  This page receives Supabase auth redirects (email confirmation, password
    //  recovery, magic link) and passes the token/code to the native iOS app
    //  via deep link. We treat all URL params as UNTRUSTED input.
    // ═══════════════════════════════════════════════════════════════════════════

    (function () {
      'use strict';

      // ── Constants ─────────────────────────────────────────────────────────
      // Hardcoded deep link scheme — NEVER use a redirect_to param from the URL
      // (would be an open redirect vulnerability).
      var DEEP_LINK_SCHEME = 'liftiq://';
      var APP_STORE_URL = 'https://apps.apple.com/app/id6759868402';

      // Max lengths to prevent DoS via absurdly long URL params.
      var MAX_TOKEN_LEN = 4096;
      var MAX_TYPE_LEN = 32;
      var MAX_CODE_LEN = 256;

      // Allowlist of flow types Supabase actually sends us.
      var VALID_TYPES = ['signup', 'recovery', 'magiclink', 'email_change', 'invite'];

      // Regex for acceptable code/token characters (base64url + JWT chars).
      // Rejects anything with <, >, ", ', backtick, newlines, etc.
      var SAFE_TOKEN_RE = /^[A-Za-z0-9._\-]+$/;

      // ── Helpers ───────────────────────────────────────────────────────────
      function isES() {
        try {
          return (navigator.language || 'en').toLowerCase().indexOf('es') === 0;
        } catch (_) {
          return false;
        }
      }

      function sanitizeToken(value, maxLen) {
        if (typeof value !== 'string') return null;
        if (value.length === 0 || value.length > maxLen) return null;
        if (!SAFE_TOKEN_RE.test(value)) return null;
        return value;
      }

      function sanitizeType(value) {
        if (typeof value !== 'string') return null;
        if (value.length === 0 || value.length > MAX_TYPE_LEN) return null;
        return VALID_TYPES.indexOf(value) !== -1 ? value : null;
      }

      function clearUrl() {
        // Remove tokens from URL so they don't leak into:
        //  - browser history (and cross-device sync)
        //  - window.location.href (visible to any same-origin script)
        //  - document.referrer when the user clicks any outgoing link
        try {
          if (window.history && typeof window.history.replaceState === 'function') {
            window.history.replaceState(null, '', window.location.pathname);
          }
        } catch (_) { /* noop */ }
      }

      function setText(id, text) {
        var el = document.getElementById(id);
        if (el) el.textContent = text;
      }

      function setHref(id, href) {
        var el = document.getElementById(id);
        if (el) el.setAttribute('href', href);
      }

      // ── i18n strings ──────────────────────────────────────────────────────
      var es = isES();
      var strings = es ? {
        title: 'LiftIQ — ¡Ya estás dentro!',
        taglineHtml: 'Listo para <strong>transformar tu vida</strong>.<br/>Vamos al trabajo.',
        statusOpening: 'Abriendo LiftIQ…',
        cardHeadingOk: '✅ ¡Cuenta confirmada!',
        cardSubOk: 'Tu cuenta está verificada. Toca abajo si la app no se abre sola.',
        btnOpen: 'Abrir LiftIQ',
        btnStore: 'Descargar en App Store',
        cardHeadingErr: '⚠️ Enlace caducado',
        cardSubErr: 'Este enlace caducó o ya fue utilizado. Solicita uno nuevo desde la app.',
        statusInvalid: 'Enlace no válido',
        btnBack: 'Volver a LiftIQ',
        recoveryTagline: 'Restableciendo tu contraseña.',
        recoveryAlmost: '¡Ya casi!',
        recoveryHeading: '🔐 Restablecer contraseña',
        recoverySub: 'Toca abajo para abrir LiftIQ y elegir una nueva contraseña.',
        recoveryBadge: '🔑 Restablecer contraseña'
      } : {
        title: "LiftIQ — You're in!",
        taglineHtml: "You're ready to <strong>transform your life</strong>.<br/>Let's get to work.",
        statusOpening: 'Opening LiftIQ…',
        cardHeadingOk: "✅ You're confirmed!",
        cardSubOk: "Your account is verified. Tap below if the app doesn't open automatically.",
        btnOpen: 'Open LiftIQ',
        btnStore: 'Download on the App Store',
        cardHeadingErr: '⚠️ Link expired',
        cardSubErr: 'This link has expired or already been used. Please request a new one in the app.',
        statusInvalid: 'Link invalid',
        btnBack: 'Back to LiftIQ',
        recoveryTagline: 'Resetting your password.',
        recoveryAlmost: 'Almost there!',
        recoveryHeading: '🔐 Reset your password',
        recoverySub: 'Tap below to open LiftIQ and choose your new password.',
        recoveryBadge: '🔑 Password Reset'
      };

      // Apply i18n
      document.title = strings.title;
      var tagline = document.getElementById('tagline');
      if (tagline) {
        // Safe to use innerHTML here: `taglineHtml` is a hardcoded constant,
        // never user input. The <br/> is part of the design.
        tagline.innerHTML = strings.taglineHtml;
      }
      setText('status-text', strings.statusOpening);
      setText('card-heading', strings.cardHeadingOk);
      setText('card-sub', strings.cardSubOk);
      setText('btn-open', strings.btnOpen);
      setText('btn-store', strings.btnStore);

      // ── Parse URL params (from fragment first, then query) ────────────────
      // Capture original URL parts BEFORE cleaning.
      var hash = window.location.hash.slice(1);     // strip '#'
      var search = window.location.search.slice(1); // strip '?'

      var params;
      try {
        params = new URLSearchParams(hash || search);
      } catch (_) {
        params = new URLSearchParams('');
      }

      // Sanitize every input we might use.
      var type = sanitizeType(params.get('type'));
      var accessToken = sanitizeToken(params.get('access_token'), MAX_TOKEN_LEN);
      var refreshToken = sanitizeToken(params.get('refresh_token'), MAX_TOKEN_LEN);
      var code = sanitizeToken(params.get('code'), MAX_CODE_LEN);
      var hasError = !!params.get('error');

      // IMMEDIATELY clear the URL — remove tokens from history and referrer.
      // We've already captured what we need in sanitized local variables.
      clearUrl();

      // ── Render appropriate state ──────────────────────────────────────────
      if (hasError) {
        setText('card-heading', strings.cardHeadingErr);
        setText('card-sub', strings.cardSubErr);
        setText('status-text', strings.statusInvalid);
        var dot = document.querySelector('.status-dot');
        if (dot) dot.style.background = '#ef4444';
        setHref('btn-open', DEEP_LINK_SCHEME);
        setText('btn-open', strings.btnBack);
        return; // no auto-redirect on error
      }

      // Password reset UI — update copy before building deep link.
      if (type === 'recovery') {
        if (tagline) {
          tagline.replaceChildren(
            document.createTextNode(strings.recoveryTagline),
            document.createElement('br'),
            Object.assign(document.createElement('strong'), { textContent: strings.recoveryAlmost })
          );
        }
        setText('card-heading', strings.recoveryHeading);
        setText('card-sub', strings.recoverySub);

        var badge = document.createElement('div');
        badge.className = 'recovery-badge';
        badge.textContent = strings.recoveryBadge;
        var card = document.querySelector('.card');
        if (card) card.prepend(badge);
      }

      // ── Build the deep link (always starts with hardcoded scheme) ─────────
      var deepLink;
      if (code) {
        // PKCE flow — pass the sanitized code through.
        deepLink = DEEP_LINK_SCHEME + 'callback?code=' + encodeURIComponent(code);
        if (type) deepLink += '&type=' + encodeURIComponent(type);
      } else if (accessToken) {
        // Implicit flow — rebuild fragment from sanitized pieces only.
        // We do NOT pass the raw original hash (could contain unsanitized junk).
        var parts = ['access_token=' + encodeURIComponent(accessToken)];
        if (refreshToken) parts.push('refresh_token=' + encodeURIComponent(refreshToken));
        if (type) parts.push('type=' + encodeURIComponent(type));
        deepLink = DEEP_LINK_SCHEME + 'callback#' + parts.join('&');
      } else {
        // No recognized auth params — just open the app cold.
        deepLink = DEEP_LINK_SCHEME;
      }

      setHref('btn-open', deepLink);

      // ── Auto-redirect after short delay ───────────────────────────────────
      // We do NOT wait for user interaction because the tokens in the URL are
      // already gone (we cleared them above). The deep link lives only in the
      // href of the button and as a location change.
      setTimeout(function () {
        try {
          window.location.href = deepLink;
        } catch (_) { /* user can tap the button */ }
      }, 1200);
    })();
  </script>

</body>
</html>
